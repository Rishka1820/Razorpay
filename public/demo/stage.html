<!doctype html><html><head><meta charset="utf-8"><title>Demo stage</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:'Inter Variable',Inter,system-ui,sans-serif}
body{transition:background .9s;background:linear-gradient(160deg,#f6f9ff 0%,#d9e7ff 100%);color:#072350;position:relative}
body.dark{background:linear-gradient(170deg,#040a2b 0%,#0a1d66 55%,#1364f1 140%);color:#fff}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;background:#9cc0ff;animation:drift 14s ease-in-out infinite alternate}
.dark .blob{background:#1c4fd8;opacity:.5}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(80px,50px)}}
.brand{position:absolute;top:34px;right:56px;font-weight:700;font-size:26px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;z-index:5}
.brand i{width:16px;height:22px;background:#1364f1;transform:skewX(-14deg);border-radius:2px;display:block}
.brand small{font-weight:500;opacity:.65;font-size:20px;margin-left:6px}
h1{position:absolute;top:34px;left:0;right:0;margin:0;text-align:center;font-size:56px;line-height:64px;font-weight:700;letter-spacing:-.02em;z-index:4}
h1 em{font-style:normal;color:#1364f1}.dark h1 em{color:#7fb0ff}
.sub{position:absolute;top:106px;left:0;right:0;text-align:center;font-size:26px;opacity:.72;z-index:4}
.in{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.phones{position:absolute;top:158px;left:0;right:0;display:flex;justify-content:center;gap:56px;transition:opacity .6s,transform .8s;z-index:3}
.phones.hide{opacity:0;transform:scale(.96)}
.ph{width:420px;height:810px;border-radius:46px;background:#0b0f1e;padding:14px;box-shadow:0 30px 80px rgba(7,35,80,.35);transform:scale(1.11);transform-origin:top center;margin-bottom:90px}
.ph iframe{width:392px;height:782px;border:0;border-radius:34px;background:#fff;display:block}
.phones.enter .ph:nth-child(1){animation:slideL .8s cubic-bezier(.2,.8,.2,1) both}
.phones.enter .ph:nth-child(2){animation:slideR .8s .1s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideL{from{opacity:0;transform:translateX(-120px) scale(1.11)}to{opacity:1;transform:scale(1.11)}}
@keyframes slideR{from{opacity:0;transform:translateX(120px) scale(1.11)}to{opacity:1;transform:scale(1.11)}}
.tag{position:absolute;top:150px;font-size:20px;font-weight:600;opacity:.6;z-index:4}
#side{position:absolute;left:60px;top:300px;width:400px;z-index:4}
#step{font-size:20px;font-weight:700;letter-spacing:.12em;color:#1364f1;margin-bottom:14px}.dark #step{color:#7fb0ff}
#cap{font-size:40px;line-height:50px;font-weight:700;letter-spacing:-.01em}
#pops{position:absolute;right:50px;top:300px;width:400px;display:flex;flex-direction:column;gap:18px;z-index:4}
.pop{background:#fff;border-radius:16px;padding:18px 22px;box-shadow:0 18px 44px rgba(7,35,80,.22);border-left:8px solid #1364f1;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;color:#072350}
.pop b{display:block;font-size:40px;letter-spacing:-.02em;line-height:46px}.pop span{font-size:21px;opacity:.7}
.pop.ok{border-color:#008f47}.pop.ok b{color:#008f47}.pop.warn{border-color:#e08a00}
.pop.out{animation:popout .4s ease both}
@keyframes pop{from{opacity:0;transform:translateX(60px) scale(.9)}to{opacity:1;transform:none}}
@keyframes popout{to{opacity:0;transform:translateX(40px)}}
.rip{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(19,100,241,.35);border:3px solid #1364f1;z-index:20;pointer-events:none;animation:rip .7s ease-out both}
@keyframes rip{from{transform:scale(.4);opacity:1}to{transform:scale(2.6);opacity:0}}
#bar{position:absolute;left:0;bottom:0;height:8px;background:#1364f1;width:0;transition:width .8s;z-index:6}
#card{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:28px;text-align:center;z-index:10;color:#fff;background:linear-gradient(170deg,#040a2b 0%,#0a1d66 55%,#1364f1 140%);opacity:0;transition:opacity .7s;padding:0 220px}
#card.show{opacity:1}
#card>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}#card>*:nth-child(2){animation-delay:.25s}#card>*:nth-child(3){animation-delay:.6s}
#card .av{width:160px;height:160px;border-radius:50%;background:#1364f1;display:grid;place-items:center;font-size:78px;font-weight:700}
#card h2{margin:0;font-size:84px;line-height:92px;letter-spacing:-.02em}
#card p{margin:0;font-size:40px;line-height:54px;opacity:.88}
#card .bub{background:#fff;color:#072350;border-radius:32px;padding:30px 48px;font-size:46px;font-weight:700;line-height:60px;max-width:1250px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#card .big{font-size:96px;line-height:104px}

#dim{position:absolute;inset:0;z-index:15;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(circle at var(--cx,50%) var(--cy,50%),transparent 0,transparent var(--r,160px),rgba(4,10,43,.62) calc(var(--r,160px) + 60px))}
#dim.on{opacity:1}
.ring{position:absolute;z-index:16;pointer-events:none;border:5px solid #ffb020;border-radius:22px;box-shadow:0 0 0 6px rgba(255,176,32,.25);animation:ringin .55s cubic-bezier(.2,1.3,.4,1) both}
@keyframes ringin{from{opacity:0;transform:scale(1.25)}to{opacity:1;transform:none}}
.ring.out{animation:ringout .35s ease both}@keyframes ringout{to{opacity:0;transform:scale(.96)}}
.arrow{position:absolute;z-index:17;font-size:54px;pointer-events:none;animation:bob .7s ease-in-out infinite alternate;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(12px)}}
.phones{transition:opacity .6s,transform .9s cubic-bezier(.3,.7,.2,1)}
</style></head><body>
<div class="blob" style="width:600px;height:600px;left:-150px;top:500px"></div><div class="blob" style="width:520px;height:520px;right:-100px;top:-120px"></div>
<div class="brand"><i></i>Razorpay<small>Order Book</small></div>
<h1 id="h"></h1><div class="sub" id="s"></div>
<div id="side"><div id="step"></div><div id="cap"></div></div>
<div id="pops"></div>
<div class="phones" id="ph">
  <div class="ph"><iframe id="left" name="left" src="/chat"></iframe></div>
  <div class="ph"><iframe id="right" name="right" src="/"></iframe></div>
</div>
<div id="dim"></div><div id="bar"></div>
<div id="card"></div>
<script>
const $=id=>document.getElementById(id);
const re=(el)=>{el.classList.remove('in');void el.offsetWidth;el.classList.add('in')};
window.scene=(h,s,dark,step,total,keep)=>{document.body.classList.toggle('dark',!!dark);$('h').innerHTML=h||'';$('s').textContent=s||'';re($('h'));re($('s'));
 $('step').textContent=step?('STEP '+step+' OF '+total):'';if(total)$('bar').style.width=(step/total*100)+'%';
 if(!keep){const p=$('ph');p.classList.remove('enter');void p.offsetWidth;p.classList.add('enter');}};
window.cap=t=>{$('cap').innerHTML=t||'';re($('cap'))};
window.pop=(big,small,kind,ms)=>{const d=document.createElement('div');d.className='pop '+(kind||'');d.innerHTML='<b>'+big+'</b><span>'+small+'</span>';$('pops').appendChild(d);
 const kids=$('pops').children;while(kids.length>3)kids[0].remove();setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),400)},ms||5000)};
window.clearpops=()=>{$('pops').innerHTML=''};
window.ripple=(x,y)=>{const r=document.createElement('div');r.className='rip';r.style.left=x+'px';r.style.top=y+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),800)};
window.zoom=(x,y,k)=>{const p=$('ph');p.style.transformOrigin=x+'px '+(y-158)+'px';p.style.transform='scale('+k+')';$('h').style.opacity=.12;$('s').style.opacity=.12};
window.unzoom=()=>{$('ph').style.transform='none';$('h').style.opacity=1;$('s').style.opacity=1};
window.hl=(x,y,w,h,ms)=>{const r=document.createElement('div');r.className='ring';r.style.left=(x-10)+'px';r.style.top=(y-10)+'px';r.style.width=(w+20)+'px';r.style.height=(h+20)+'px';document.body.appendChild(r);
 const dim=$('dim');dim.style.setProperty('--cx',(x+w/2)+'px');dim.style.setProperty('--cy',(y+h/2)+'px');dim.style.setProperty('--r',(Math.max(w,h)/2+20)+'px');dim.classList.add('on');
 setTimeout(()=>{dim.classList.remove('on');r.classList.add('out');setTimeout(()=>r.remove(),400)},ms||2200)};
window.card=(html)=>{const c=$('card');if(html){c.innerHTML=html;c.style.display='flex';requestAnimationFrame(()=>c.classList.add('show'))}else{c.classList.remove('show');setTimeout(()=>{c.style.display='none'},700)}};
</script></body></html>
